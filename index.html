<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 냉장고</title>
<meta name="theme-color" content="#2f7d6d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉장고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#22252b; --sub:#6b6f78; --line:#e6e2d9;
    --accent:#2f7d6d; --accent-soft:#e3f1ec;
    --red:#c8442f; --red-soft:#fbe6e1; --orange:#c47a12; --orange-soft:#fbf0dc;
    --green:#2f7d6d; --green-soft:#e3f1ec;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17191c; --card:#22252a; --ink:#eceae5; --sub:#9a9ea6; --line:#33373d;
      --accent:#5fbfa9; --accent-soft:#1f3631;
      --red:#ff8a75; --red-soft:#3d2420; --orange:#f0b45a; --orange-soft:#3a2f1c;
      --green:#5fbfa9; --green-soft:#1f3631;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
  header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
  header p{margin:4px 0 0;color:var(--sub);font-size:14px}

  .stats{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
  .stat{flex:1 1 0;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
  .stat b{display:block;font-size:22px;font-weight:800}
  .stat span{font-size:12.5px;color:var(--sub)}
  .stat.red b{color:var(--red)} .stat.orange b{color:var(--orange)}
  .stat.on{outline:2px solid var(--accent)}

  .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
  .search-box:focus-within{border-color:var(--accent)}
  .search-box input{flex:1;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px}
  .search-box .x{border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px;display:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip small{opacity:.6;margin-left:3px}

  .notice{font-size:13px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  .notice.warn{color:var(--orange);border-color:var(--orange)}

  .cat{margin-top:22px}
  .cat-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
  .cat-h h2{margin:0;font-size:18px;font-weight:800}
  .cat-h span{color:var(--sub);font-size:13px}
  .sub{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
  .sub-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--accent-soft);font-weight:700;font-size:14.5px}
  .sub-h span{font-weight:500;color:var(--sub);font-size:13px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
  .sub > .item:first-of-type{border-top:0}
  .sub-h + .item{border-top:0}
  .item .info{flex:1;min-width:0;cursor:pointer}
  .item .name{font-weight:700;font-size:15.5px;word-break:keep-all;overflow-wrap:anywhere}
  .item .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-orange{background:var(--orange-soft);color:var(--orange)}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-none{background:var(--line);color:var(--sub)}
  .qty{display:flex;align-items:center;gap:2px;flex:none}
  .qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer;line-height:1}
  .qty b{min-width:46px;text-align:center;font-size:15px;white-space:nowrap}
  mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
  @media (prefers-color-scheme: dark){ mark{background:#6b5a14} }

  .empty{text-align:center;color:var(--sub);padding:50px 10px}
  .empty .big{font-size:44px}

  .fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:22px;z-index:10;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:15px 22px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
  @media (prefers-color-scheme: dark){ .fab{color:#10221e} }

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 24px}
  @media (min-width:600px){ .modal-bg{align-items:center} .modal{border-radius:20px} }
  .modal h3{margin:0 0 14px;font-size:19px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
  .field label em{font-style:normal;font-weight:400}
  .field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--bg);font-size:16px;outline:0}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .cat-pick{display:flex;flex-wrap:wrap;gap:6px}
  .cat-pick button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
  .cat-pick button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
  .quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .quick button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
  .err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}
  .actions{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15.5px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#10221e} }
  .btn.ghost{background:var(--bg);border:1px solid var(--line)}
  .btn.danger{background:var(--red-soft);color:var(--red);flex:0 0 auto;padding:13px 16px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  /* ── 앱 전용 추가 ── */
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .wrap{padding-top:max(20px, env(safe-area-inset-top)); padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
  .fab{bottom:max(22px, calc(env(safe-area-inset-bottom) + 12px))}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .gear{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;flex:none}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:2px;text-align:center;background:var(--bg);border:1.5px dashed var(--accent);border-radius:12px;padding:12px;margin:6px 0 10px;user-select:all;-webkit-user-select:all}
  .help{font-size:13.5px;color:var(--sub);line-height:1.6;margin:0 0 12px}
  .stack{display:flex;flex-direction:column;gap:8px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .status{font-size:13px;color:var(--sub);margin-bottom:12px}
  .status b.ok{color:var(--green)} .status b.off{color:var(--orange)}
  .setup{max-width:460px;margin:40px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;box-shadow:var(--shadow)}
  .setup h2{margin:0 0 6px;font-size:21px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🧊 우리집 냉장고</h1>
      <p>산 음식을 적어두고, 유통기한 가까운 것부터 먹어요.</p>
    </div>
    <button class="gear" id="gearBtn" aria-label="설정">⚙️</button>
  </header>

  <!-- 처음 시작: 가족 코드 정하기 -->
  <div id="setup" class="setup" style="display:none">
    <h2>가족 냉장고 연결하기</h2>
    <p class="help">가족끼리 같은 <b>가족 코드</b>를 쓰면 같은 냉장고 목록을 함께 봐요.<br>
      처음 쓰는 사람이 새로 만들고, 나머지 가족은 그 코드를 넣으면 돼요.</p>
    <div class="stack">
      <button class="btn primary" id="newFamilyBtn">새 냉장고 만들기</button>
      <div class="divider"></div>
      <div class="field">
        <label for="joinInput">가족에게 받은 코드가 있어요</label>
        <input id="joinInput" placeholder="예: ABCD-EFGH-JKLM" autocapitalize="characters" autocomplete="off">
      </div>
      <div class="err" id="joinErr"></div>
      <button class="btn ghost" id="joinBtn">이 코드로 연결</button>
    </div>
  </div>

  <div id="main">
    <div class="stats" id="stats"></div>

    <div class="search">
      <div class="search-box">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="찾을 음식을 입력하세요 (예: 우유, 사과)" autocomplete="off">
        <button class="x" id="qx" aria-label="검색어 지우기">✕</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div id="notice"></div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<button class="fab" id="addBtn">＋ 음식 추가</button>

<!-- 추가 / 수정 -->
<div class="modal-bg" id="formBg">
  <form class="modal" id="form" autocomplete="off">
    <h3 id="formTitle">음식 추가</h3>
    <div class="field">
      <label>대분류</label>
      <div class="cat-pick" id="catPick"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fSub">소분류 <em>(없으면 비워두세요)</em></label>
        <input id="fSub" list="subList" placeholder="예: 사과">
        <datalist id="subList"></datalist>
      </div>
      <div class="field">
        <label for="fName">이름</label>
        <input id="fName" placeholder="예: 부사 사과" maxlength="40">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:0 0 120px">
        <label for="fQty">개수</label>
        <input id="fQty" type="number" min="0" step="1" inputmode="numeric" value="1">
      </div>
      <div class="field">
        <label for="fBuy">산 날짜</label>
        <input id="fBuy" type="date">
      </div>
    </div>
    <div class="field">
      <label for="fExp">유통기한 <em>(모르면 비워둬도 돼요)</em></label>
      <input id="fExp" type="date">
      <div class="quick" id="quick"></div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" style="display:none">삭제</button>
      <button type="button" class="btn ghost" id="cancelBtn">취소</button>
      <button type="submit" class="btn primary" id="saveBtn">저장</button>
    </div>
  </form>
</div>

<!-- 설정 -->
<div class="modal-bg" id="setBg">
  <div class="modal">
    <h3>설정</h3>
    <div class="status" id="setStatus"></div>
    <div id="setFamily">
      <label class="help" style="display:block;margin:0">우리 가족 코드</label>
      <div class="code" id="setCode"></div>
      <div class="stack">
        <button class="btn primary" id="copyLinkBtn">가족 초대 링크 복사</button>
        <button class="btn ghost" id="copyCodeBtn">코드만 복사</button>
      </div>
      <p class="help" style="margin-top:10px">링크를 카톡으로 보내면, 가족이 누르기만 해도 같은 냉장고에 연결돼요.<br>
        ⚠️ 코드를 아는 사람은 목록을 보고 고칠 수 있으니 가족에게만 알려주세요.</p>
      <div class="divider"></div>
      <button class="btn ghost" id="switchBtn" style="width:100%">다른 가족 코드로 바꾸기</button>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn ghost" id="setClose">닫기</button>
    </div>
  </div>
</div>

<!-- 확인 창 -->
<div class="modal-bg" id="askBg">
  <div class="modal">
    <h3 id="askText">삭제할까요?</h3>
    <div class="actions">
      <button class="btn ghost" id="askNo">취소</button>
      <button class="btn primary" id="askYes" style="background:var(--red)">삭제</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
